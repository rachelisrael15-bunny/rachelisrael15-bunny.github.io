<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interactive Keyboard</title>
  <style>
    body { margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #e8d8ff; font-family: Arial, sans-serif; }
    h1 { margin-bottom: 10px; color: #333; text-align: center; }

    /* Staff area */
    .staff-container { margin-bottom: 20px; text-align: center; position: relative; }
    .staff-svg { width: 500px; height: 160px; border: 2px solid #000; background: #fff; border-radius: 4px; display: block; }

    /* Keyboard area */
    .keyboard { position: relative; display: flex; justify-content: center; background: #fff; border: 2px solid #000; box-shadow: 0 0 10px rgba(0,0,0,0.3); height: 250px; }
    .white-key { width: 60px; height: 250px; background: #fff; border: 1px solid #000; position: relative; box-sizing: border-box; display: flex; align-items: flex-end; justify-content: center; cursor: pointer; user-select: none; z-index: 1; }
    .white-key:active { background: #e0e0ff; }
    .note-label-key { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); color: #fff; padding: 5px 10px; border-radius: 5px; opacity: 0; transition: opacity 0.1s; pointer-events: none; }
    .white-key.active .note-label-key, .black-key.active .note-label-key { opacity: 1; }
    .black-key { position: absolute; width: 35px; height: 150px; background: #000; border-radius: 0 0 3px 3px; z-index: 2; cursor: pointer; user-select: none; }
    .black-key:active { background: #222; }
    .keyboard-container { position: relative; display: inline-block; }
    .black-keys { position: absolute; top: 0; left: 0; right: 0; height: 150px; pointer-events: none; }
    .black-keys .black-key { pointer-events: auto; }
    .Csharp4 { left: 45px; } .Dsharp4 { left: 105px; } .Fsharp4 { left: 225px; } .Gsharp4 { left: 285px; } .Asharp4 { left: 345px; } .Csharp5 { left: 465px; } .Dsharp5 { left: 525px; }
  </style>
</head>
<body>
  <h1>Interactive Keyboard</h1>

  <!-- STAFF with bar lines on both sides -->
  <div class="staff-container">
    <svg class="staff-svg" viewBox="0 0 520 160" xmlns="http://www.w3.org/2000/svg" aria-label="Treble clef staff E4–F5">
      <!-- Staff lines -->
      <g stroke="#000" stroke-width="2" fill="none">
        <line x1="70" y1="45" x2="480" y2="45" />
        <line x1="70" y1="65" x2="480" y2="65" />
        <line x1="70" y1="85" x2="480" y2="85" />
        <line x1="70" y1="105" x2="480" y2="105" />
        <line x1="70" y1="125" x2="480" y2="125" />
      </g>

      <!-- Bar line at beginning of staff -->
      <line x1="70" y1="45" x2="70" y2="125" stroke="#000" stroke-width="4" />

      <!-- Notes E4–F5 (solid heads) and labels -->
      <g fill="#000" stroke="none">
        <circle cx="140" cy="125" r="6" />
        <circle cx="180" cy="115" r="6" />
        <circle cx="220" cy="105" r="6" />
        <circle cx="260" cy="95"  r="6" />
        <circle cx="300" cy="85"  r="6" />
        <circle cx="340" cy="75"  r="6" />
        <circle cx="380" cy="65"  r="6" />
        <circle cx="420" cy="55"  r="6" />
        <circle cx="460" cy="45"  r="6" />
      </g>
      <g font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">
        <text x="140" y="147">E</text>
        <text x="180" y="147">F</text>
        <text x="220" y="147">G</text>
        <text x="260" y="147">A</text>
        <text x="300" y="147">B</text>
        <text x="340" y="147">C</text>
        <text x="380" y="147">D</text>
        <text x="420" y="147">E</text>
        <text x="460" y="147">F</text>
      </g>

      <!-- Bar line at end of staff -->
      <line x1="480" y1="45" x2="480" y2="125" stroke="#000" stroke-width="4" />
    </svg>
  </div>

  <!-- KEYBOARD -->
  <div class="keyboard-container">
    <div class="keyboard">
      <div class="white-key" data-note="C4"><span class="note-label-key">C</span></div>
      <div class="white-key" data-note="D4"><span class="note-label-key">D</span></div>
      <div class="white-key" data-note="E4"><span class="note-label-key">E</span></div>
      <div class="white-key" data-note="F4"><span class="note-label-key">F</span></div>
      <div class="white-key" data-note="G4"><span class="note-label-key">G</span></div>
      <div class="white-key" data-note="A4"><span class="note-label-key">A</span></div>
      <div class="white-key" data-note="B4"><span class="note-label-key">B</span></div>
      <div class="white-key" data-note="C5"><span class="note-label-key">C</span></div>
      <div class="white-key" data-note="D5"><span class="note-label-key">D</span></div>
      <div class="white-key" data-note="E5"><span class="note-label-key">E</span></div>
      <div class="white-key" data-note="F5"><span class="note-label-key">F</span></div>
    </div>
    <div class="black-keys">
      <div class="black-key Csharp4" data-note="C#4"><span class="note-label-key">C#</span></div>
      <div class="black-key Dsharp4" data-note="D#4"><span class="note-label-key">D#</span></div>
      <div class="black-key Fsharp4" data-note="F#4"><span class="note-label-key">F#</span></div>
      <div class="black-key Gsharp4" data-note="G#4"><span class="note-label-key">G#</span></div>
      <div class="black-key Asharp4" data-note="A#4"><span class="note-label-key">A#</span></div>
      <div class="black-key Csharp5" data-note="C#5"><span class="note-label-key">C#</span></div>
      <div class="black-key Dsharp5" data-note="D#5"><span class="note-label-key">D#</span></div>
    </div>
  </div>

  <script>
    const AudioContext = window.AudioContext || window.webkitAudioContext; const audioCtx = new AudioContext();
    const noteFreq = { 'C4':261.63,'C#4':277.18,'D4':293.66,'D#4':311.13,'E4':329.63,'F4':349.23,'F#4':369.99,'G4':392.00,'G#4':415.30,'A4':440.00,'A#4':466.16,'B4':493.88,'C5':523.25,'C#5':554.37,'D5':587.33,'D#5':622.25,'E5':659.25,'F5':698.46 };
    const activeVoices = new Map();
    function startNote(note, el){ if(note.includes('#')){ el.classList.add('active'); return; } const osc=audioCtx.createOscillator(); const gain=audioCtx.createGain(); osc.type='sine'; osc.frequency.value=noteFreq[note]; osc.connect(gain).connect(audioCtx.destination); gain.gain.setValueAtTime(0.001,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.5,audioCtx.currentTime+0.01); osc.start(); activeVoices.set(note,{osc,gain}); el.classList.add('active'); }
    function stopNote(note, el){ const v=activeVoices.get(note); if(v){ v.gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.1); v.osc.stop(audioCtx.currentTime+0.1); activeVoices.delete(note);} el.classList.remove('active'); }
    document.querySelectorAll('.white-key, .black-key').forEach(key=>{ const note=key.dataset.note; key.addEventListener('mousedown',()=>startNote(note,key)); key.addEventListener('mouseup',()=>stopNote(note,key)); key.addEventListener('mouseleave',()=>stopNote(note,key)); key.addEventListener('touchstart',e=>{e.preventDefault();startNote(note,key);}); key.addEventListener('touchend',()=>stopNote(note,key)); });
  </script>
</body>
</html>
